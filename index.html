<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Space 💖</title>
    
    <!-- โหลด Font Awesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- โหลด Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <!-- โหลดฟอนต์ คชสาร (Krub) จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            /* พื้นหลังไล่สีโทนชมพู-ขาว นุ่มฟู */
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
            background-attachment: fixed;
            font-family: 'Krub', sans-serif;
            color: #5c4b51;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* เอฟเฟกต์ของร่วงหล่น */
        .snow-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .snowflake {
            position: absolute; top: -10%;
            color: rgba(244, 143, 177, 0.6);
            font-size: 1.2rem; user-select: none;
            animation-name: fall, sway;
            animation-iteration-count: infinite;
            animation-timing-function: linear, ease-in-out;
        }
        @keyframes fall {
            0% { top: -10%; }
            100% { top: 110%; }
        }
        @keyframes sway {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(20px); }
        }

        /* กล่องหลักสไตล์ Glassmorphism */
        .home-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(244, 143, 177, 0.2);
            border-radius: 25px;
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 450px;
            width: 90%;
            position: relative;
            z-index: 1;
        }

        .avatar-box {
            width: 90px; height: 90px;
            background-color: #fce4ec;
            border-radius: 50%;
            margin: 0 auto 1.5rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            color: #d81b60;
            box-shadow: 0 4px 15px rgba(244, 143, 177, 0.3);
            border: 2px solid #fff;
        }

        h1 {
            color: #d81b60;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #880e4f;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        /* สไตล์ปุ่มกดเลือกเมนู */
        .btn-menu {
            background-color: #ffffff;
            color: #d81b60;
            border: 2px solid #f8bbd0;
            border-radius: 15px;
            font-weight: 600;
            font-size: 1rem;
            padding: 12px 20px;
            margin-bottom: 12px;
            width: 100%;
            display: block;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(244, 143, 177, 0.1);
        }

        .btn-menu:hover {
            background-color: #f48fb1;
            color: white;
            border-color: #f48fb1;
            text-decoration: none;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(244, 143, 177, 0.3);
        }

        .btn-menu i {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <!-- เอฟเฟกต์ของร่วงหล่นพื้นหลัง -->
    <div class="snow-container" id="snow-container"></div>

    <div class="home-card">
        <!-- ไอคอนโปรไฟล์กลมๆ (หรือจะเปลี่ยนเป็นรูปภาพตัวเองก็ได้ค่ะ) -->
        <div class="avatar-box">
            <i class="fas fa-heart"></i>
        </div>

        <h1>Welcome to My Space 🌸</h1>
        <p>
            พื้นที่สำหรับรับจัดระเบียบ Toyhouse (คอมมิชชัน)<br>
            และคลังแจกโค้ด HTML/CSS ส่วนตัวค่ะ ☁️✨
        </p>

        <!-- ปุ่มไปหน้าสั่งงานคอมมิชชัน (เปลี่ยนชื่อไฟล์คอมมิชชันของคุณตรง href ได้เลยค่ะ เช่น commission.html) -->
        <a href="commission.html" class="btn-menu">
            <i class="fas fa-store"></i> Toyhouse Services (Commission)
        </a>

        <!-- ปุ่มไปหน้าแจกโค้ด -->
        <a href="codes.html" class="btn-menu">
            <i class="fas fa-code"></i> My Toyhouse Codes (Locked)
        </a>
    </div>

    <!-- โหลด Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    
    <script>
        // ฟังก์ชันสร้างของร่วงหล่น
        function createSnowflakes() {
            const container = document.getElementById('snow-container');
            const symbols = ['🌸', '🎀', '💖', '✨', '☁️', '🤍']; 
            const numFlakes = 25; 

            for (let i = 0; i < numFlakes; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                
                let fallDuration = Math.random() * 5 + 7; 
                flake.style.animationDuration = fallDuration + 's, ' + (fallDuration/2) + 's';
                flake.style.animationDelay = Math.random() * 5 + 's, ' + Math.random() * 5 + 's';
                flake.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem'; 
                flake.style.opacity = Math.random() * 0.4 + 0.3; 

                container.appendChild(flake);
            }
        }
        createSnowflakes();
    </script>

</body>
</html>
