<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyanos's OC x Canon List 💜</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. BASE STYLES & LIQUID BACKGROUND
           ========================================================================== */
        body { margin: 0; padding: 3rem 1rem; min-height: 100vh; font-family: 'Krub', sans-serif; color: #4a3b52; background-color: #fffdfd; position: relative; overflow-x: hidden; }
        .liquid-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; pointer-events: none; background: linear-gradient(135deg, #fdf6fa 0%, #fcecf2 50%, #f6eff8 100%); }
        .liquid-blob { position: absolute; filter: blur(60px); opacity: 0.55; animation: morphLiquid 15s ease-in-out infinite alternate, floatLiquid 20s linear infinite; }
        .blob-purple { background: linear-gradient(120deg, #edf2ff 0%, #e6d5fa 100%); width: 500px; height: 500px; top: -10%; left: -5%; }
        .blob-lavender { background: linear-gradient(120deg, #fdf6fa 0%, #e2d9ef 100%); width: 600px; height: 600px; bottom: -15%; right: -5%; animation-delay: -5s; }
        .blob-pink { background: linear-gradient(120deg, #fff0f5 0%, #fae1e7 100%); width: 350px; height: 350px; top: 30%; left: 50%; opacity: 0.4; animation-delay: -10s; }

        @keyframes morphLiquid { 0% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; } 34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; } 67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; } 100% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; } }
        @keyframes floatLiquid { 0% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(30px, -50px) rotate(120deg); } 66% { transform: translate(-20px, 20px) rotate(240deg); } 100% { transform: translate(0, 0) rotate(360deg); } }

        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.3); } ::-webkit-scrollbar-thumb { background: #e1bee7; border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: #ce93d8; }
        .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .snowflake { position: absolute; top: -10%; color: rgba(255, 255, 255, 0.9); text-shadow: 0 0 10px rgba(225, 190, 231, 0.8); user-select: none; animation-name: fall, sway; animation-iteration-count: infinite; animation-timing-function: linear, ease-in-out; }
        @keyframes fall { 0% { top: -10%; } 100% { top: 110%; } } @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(25px); } }

        /* ==========================================================================
           2. MAIN PANELS
           ========================================================================== */
        .glass-panel { background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); border-top: 2px solid rgba(255, 255, 255, 1); border-left: 2px solid rgba(255, 255, 255, 1); box-shadow: 0 25px 45px rgba(106, 27, 154, 0.05), inset 0 0 30px rgba(255, 255, 255, 0.6); border-radius: 40px; padding: 3rem 2.5rem; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
        .btn-back-home { display: inline-block; background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 1); border-radius: 20px; color: #8e24aa; font-weight: 600; padding: 8px 25px; margin-bottom: 20px; transition: all 0.3s ease; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .btn-back-home:hover { background: rgba(255, 255, 255, 0.95); transform: translateY(-2px); color: #6a1b9a; text-decoration: none; }
        .header-title { text-align: center; color: #7b1fa2; font-weight: 700; font-size: 2.5rem; margin-bottom: 5px; text-shadow: 0 2px 5px rgba(255,255,255,1); cursor: pointer; }
        .header-desc { text-align: center; color: #9c27b0; font-size: 1rem; margin-bottom: 1.5rem; font-weight: 600; opacity: 0.9; }
        
        .filter-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 3rem; flex-wrap: wrap; background: rgba(255, 255, 255, 0.6); padding: 15px 25px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 15px rgba(106, 27, 154, 0.03); }
        .filter-dropdown { background: rgba(255, 255, 255, 0.9); border: 1px solid #f3e5f5; color: #7b1fa2; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-family: 'Krub', sans-serif; outline: none; cursor: pointer; transition: 0.3s; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(106, 27, 154, 0.04); }
        .filter-dropdown:focus { border-color: #ce93d8; box-shadow: 0 0 10px rgba(206, 147, 216, 0.2); }
        
        .filter-belove-toggle { background: rgba(255, 255, 255, 0.9); border: 1px solid #f8bbd0; color: #d81b60; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-family: 'Krub', sans-serif; cursor: pointer; transition: 0.3s; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(216, 27, 96, 0.08); display: flex; align-items: center; gap: 8px; user-select: none; }
        .filter-belove-toggle:hover { background: #fce4ec; } .filter-belove-toggle input { display: none; }
        .filter-belove-toggle.active { background: linear-gradient(135deg, #ff4081, #e91e63); color: white; border-color: #e91e63; box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3); }
        .total-badge { background: #f3e5f5; color: #6a1b9a; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; border: 1px solid #e1bee7; }
        
        /* ==========================================================================
           3. CHARACTER CARDS
           ========================================================================== */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .couple-card { background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.9); border-top: 1px solid rgba(255, 255, 255, 1); border-left: 1px solid rgba(255, 255, 255, 1); border-radius: 25px; padding: 1.25rem; padding-top: 2.2rem; transition: all 0.3s ease; box-shadow: 0 8px 20px rgba(106, 27, 154, 0.04); position: relative; overflow: visible; display: flex; flex-direction: column; }
        .couple-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.85); box-shadow: 0 15px 30px rgba(106, 27, 154, 0.1), inset 0 0 15px rgba(255,255,255,0.8); }
        @media (min-width: 768px) { .is-3p { grid-column: span 2; } .is-3p .img-container { width: 70%; margin-left: auto; margin-right: auto; } }
        
        .whatif-badge { background: linear-gradient(135deg, #ce93d8, #f48fb1); color: white; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 5px; vertical-align: middle; box-shadow: 0 2px 5px rgba(244, 143, 177, 0.3); }
        .img-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; margin-top: 10px; position: relative; }
        .img-box { flex: 1; aspect-ratio: 1 / 1; border-radius: 15px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 1); box-shadow: 0 5px 15px rgba(0,0,0,0.06); position: relative; background: #fff; }
        .img-link { display: block; width: 100%; height: 100%; cursor: pointer; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.4s; border-radius: 13px; }
        .img-box:hover img { transform: scale(1.05); }

        .heart-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .heart-icon { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255, 255, 255, 0.9); width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #ec407a; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.08); z-index: 5; }
        .heart-2p { left: 50%; transform: translate(-50%, -50%); } .heart-3p-left { left: calc(33.33% - 2.5px); transform: translate(-50%, -50%); } .heart-3p-right { left: calc(66.66% + 2.5px); transform: translate(-50%, -50%); }
        
        .canon-box { position: relative; overflow: visible !important; } 
        .fandom-group { position: absolute; top: -12px; right: -10px; display: flex; align-items: center; gap: 5px; z-index: 10; pointer-events: none; }
        
        .badge-belove { background: rgba(255, 64, 129, 0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #e91e63; display: inline-flex; justify-content: center; align-items: center; width: 24px; height: 24px; border-radius: 50%; font-size: 0.65rem; box-shadow: 0 4px 10px rgba(233, 30, 99, 0.15), inset 0 0 5px rgba(255,255,255,0.8); border: 1px solid rgba(255, 255, 255, 0.9); margin-right: 6px; }
        .badge-fandom { background: rgba(255, 255, 255, 0.95); color: #7b1fa2; font-size: 0.7rem; font-weight: 700; padding: 4px 12px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #fdf5f9; white-space: nowrap; pointer-events: none;} 
        .badge-position { position: absolute; bottom: 8px; left: 8px; background: rgba(255, 255, 255, 0.95); color: #6a1b9a; font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); z-index: 2; pointer-events: none;}
        
        .info-section { text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; } 
        .names { font-size: 1.15rem; font-weight: 700; color: #4a3b52; margin-bottom: 5px; }
        .details-grid { background: rgba(255, 255, 255, 0.6); border-radius: 15px; padding: 12px; font-size: 0.85rem; display: grid; grid-template-columns: 1fr; gap: 8px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.8); margin-top: auto; }
        .d-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(206, 147, 216, 0.3); padding-bottom: 6px; } .d-row:last-child { border-bottom: none; padding-bottom: 0; } 
        .d-label { font-weight: 700; color: #7b1fa2; } .d-value { font-weight: 600; color: #6a5a61; text-align: right; display: flex; align-items: center; justify-content: flex-end; width: 60%;}
        
        /* --------------------------------------------------------------------------
           🎶 SONG SYSTEM (Marquee & Button) 
           -------------------------------------------------------------------------- */
        .song-marquee { max-width: 130px; display: inline-block; vertical-align: middle; color: #6a1b9a; white-space: nowrap; overflow: hidden; text-shadow: 0 0 5px rgba(206, 147, 216, 0.4); }
        .song-play-btn { color: #d81b60; margin-left: 8px; transition: 0.3s; font-size: 1.25rem; text-decoration: none !important; cursor: pointer; }
        .song-play-btn:hover { color: #e91e63; transform: scale(1.15); text-shadow: 0 0 8px rgba(233, 30, 99, 0.5); }

        .btn-story { width: 100%; background: linear-gradient(135deg, #f3e5f5, #e1bee7); border: 1px solid #ce93d8; color: #7b1fa2; padding: 8px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: 0.3s; margin-top: 10px; text-decoration: none; display: block; }
        .btn-story:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(206, 147, 216, 0.4); color: white; background: linear-gradient(135deg, #ce93d8, #ba68c8); }

        @media (max-width: 768px) { .glass-panel { padding: 2rem 1rem; } .card-grid { grid-template-columns: 1fr; } .filter-controls { flex-direction: column; width: 100%; align-items: stretch; } .total-badge { text-align: center; } .is-3p { grid-column: 1 / -1; } .is-3p .img-container { width: 100%; } }

        /* ==========================================================================
           4. MODAL STYLES (Admin & Story)
           ========================================================================== */
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: 9999; }
        .admin-content { background: rgba(255, 255, 255, 0.95); border-radius: 30px; padding: 2.5rem; width: 95%; max-width: 700px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid rgba(255, 255, 255, 1); box-shadow: 0 25px 45px rgba(106, 27, 154, 0.15); max-height: 90vh; overflow-y: auto; }
        .admin-title { color: #7b1fa2; font-weight: 700; text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
        .form-group { margin-bottom: 15px; } .form-group label { display: block; font-size: 0.9rem; color: #6a1b9a; font-weight: 700; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #e1bee7; background: #fff; color: #4a3b52; font-family: 'Krub', sans-serif; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #ce93d8; box-shadow: 0 0 10px rgba(206, 147, 216, 0.2); }
        .btn-generate { background: linear-gradient(135deg, #ce93d8, #ba68c8); color: white; width: 100%; padding: 12px; border: none; border-radius: 15px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(186, 104, 200, 0.3); }
        .result-code { width: 100%; height: 100px; margin-top: 15px; padding: 10px; border-radius: 12px; border: 1px dashed #ba68c8; background: #fdf5f9; font-family: monospace; font-size: 0.8rem; color: #4a148c; resize: none; outline: none; }
        .close-admin { position: absolute; top: 20px; right: 25px; font-size: 1.5rem; color: #ba68c8; cursor: pointer; transition: 0.3s; } .close-admin:hover { color: #7b1fa2; }

        /* Pop-up Story Modal */
        .story-title { color: #c2185b; font-weight: 700; margin-bottom: 10px; font-size: 1.5rem; text-align: center; }
        .story-info-box { background: rgba(255,255,255,0.7); border-radius: 15px; padding: 15px; border: 1px solid #f3e5f5; margin-bottom: 15px; }
        .story-heights { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .height-tag { background: #fce4ec; color: #d81b60; font-size: 0.8rem; font-weight: 700; padding: 4px 12px; border-radius: 15px; }
        .story-detail-rel { color: #6a1b9a; font-size: 0.9rem; font-weight: 600; text-align: center; line-height: 1.5; }
        
        .stat-group { margin-bottom: 12px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; color: #6a1b9a; }
        .stat-bar { background: #f3e5f5; border-radius: 10px; height: 12px; overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05); }
        .stat-fill { height: 100%; border-radius: 10px; transition: width 1.2s cubic-bezier(0.25, 0.8, 0.25, 1); width: 0%; }
        
        .fill-love { background: linear-gradient(90deg, #ff80ab, #f50057); } 
        .fill-bond { background: linear-gradient(90deg, #b388ff, #651fff); } 
        .fill-hate { background: linear-gradient(90deg, #ef9a9a, #d32f2f); } 
        
        .story-text-container { margin-top: 20px; border-top: 1px dashed #ce93d8; padding-top: 15px; }
        .story-text { color: #4a3b52; font-size: 0.95rem; line-height: 1.6; text-align: left; }

        /* Art Credits (NEW) */
        .credit-box { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ce93d8; font-size: 0.85rem; color: #7b1fa2; text-align: center; }
        .credit-link { color: #d81b60; font-weight: 700; text-decoration: none; transition: 0.3s; }
        .credit-link:hover { color: #e91e63; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="liquid-bg">
        <div class="liquid-blob blob-purple"></div>
        <div class="liquid-blob blob-lavender"></div>
        <div class="liquid-blob blob-pink"></div>
    </div>

    <div class="snow-container" id="snow-container"></div>

    <div class="glass-panel">
        
        <div class="text-center">
            <a href="index.html" class="btn-back-home"><i class="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก (Hub)</a>
        </div>

        <h1 class="header-title" ondblclick="openAdminPrompt()">OC x Canon List 💜</h1>
        <p class="header-desc">คลังเก็บความสัมพันธ์ของลูกๆ OC กับเมนคนโปรดค่ะ ✨</p>

        <!-- Filters -->
        <div class="filter-controls">
            <select id="filterFandom" class="filter-dropdown" onchange="applyFilters()">
                <option value="All">All Fandoms</option>
            </select>
            <select id="filterRelation" class="filter-dropdown" onchange="applyFilters()">
                <option value="All">💞 All Relationships</option>
                <option value="Romantic">Romantic</option>
                <option value="Platonic">Platonic</option>
                <option value="Familial">Familial</option>
            </select>
            
            <label class="filter-belove-toggle" id="btnBelove" onclick="toggleBeloveFilter()">
                <input type="checkbox" id="filterBelove">
                💖 My belove
            </label>

            <div class="total-badge" id="totalCount">Total: 0 Pairs</div>
        </div>

        <div class="card-grid" id="cardContainer"></div>
    </div>

    <!-- Hidden Player (ถูกแอบไว้นอกจอเพื่อหลีกเลี่ยงกฎบราวเซอร์) -->
    <div id="hiddenPlayer" style="position: absolute; top: -9999px; left: -9999px; width: 300px; height: 300px; opacity: 0.0001; pointer-events: none; overflow: hidden;"></div>

    <!-- ==========================================
         ADMIN MODAL 
         ========================================== -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <i class="fas fa-times close-admin" onclick="closeAdmin()"></i>
            <h2 class="admin-title"><i class="fas fa-magic"></i> Add New Pair</h2>
            <p style="text-align:center; font-size:0.85rem; color:#8e24aa;">สร้างโค้ดข้อมูลเพื่อนำไปแปะใน GitHub ได้ง่ายๆ</p>
            
            <div class="row">
                <div class="col-md-4 form-group">
                    <label>Fandom Name</label>
                    <input type="text" id="addFandom" placeholder="e.g. Genshin Impact">
                </div>
                <div class="col-md-4 form-group">
                    <label>OC Name</label>
                    <input type="text" id="addOc" placeholder="e.g. Primax">
                </div>
                <div class="col-md-4 form-group">
                    <label>Canon Name <small>(& คั่นสำหรับ 3P)</small></label>
                    <input type="text" id="addCanon" placeholder="e.g. Albedo">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 form-group">
                    <label>OC Image URL</label>
                    <input type="text" id="addImgOc" placeholder="https://...">
                </div>
                <div class="col-md-6 form-group">
                    <label>Canon Image URL <small>(3P คั่นด้วยลูกน้ำ)</small></label>
                    <input type="text" id="addImgCanon" placeholder="https://...">
                </div>
            </div>

            <div class="form-group">
                <label>OC Profile Link <small>(ลิงก์ Toyhouse ของ OC)</small></label>
                <input type="text" id="addOcLink" placeholder="https://toyhou.se/...">
            </div>

            <div class="row" style="background: rgba(243, 229, 245, 0.5); padding: 10px; border-radius: 15px; margin-bottom: 15px;">
                <div class="col-md-4 form-group mb-0">
                    <label>OC Height</label>
                    <input type="text" id="addOcHeight" placeholder="e.g. 160 cm">
                </div>
                <div class="col-md-8 form-group mb-0">
                    <label>Canon Height <small>(หากเป็น 3P คั่นด้วยลูกน้ำได้)</small></label>
                    <input type="text" id="addCanonHeight" placeholder="e.g. 180 cm หรือ 180 cm, 185 cm">
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 form-group">
                    <label>Relationship Type</label>
                    <select id="addRelation">
                        <option value="Romantic">Romantic</option>
                        <option value="Platonic">Platonic</option>
                        <option value="Familial">Familial</option>
                        <option value="-">-</option>
                    </select>
                </div>
                <div class="col-md-4 form-group">
                    <label>Position <small>(3P คั่นด้วยลูกน้ำได้)</small></label>
                    <input type="text" id="addPosition" placeholder="e.g. Top">
                </div>
                <div class="col-md-4 form-group">
                    <label>Hashtag</label>
                    <input type="text" id="addHashtag" placeholder="e.g. #AlbedoOC">
                </div>
            </div>

            <div class="row" style="background: rgba(206, 147, 216, 0.1); padding: 10px; border-radius: 15px; margin-bottom: 15px;">
                <div class="col-md-6 form-group mb-0">
                    <label>Theme Song Title <small>(ชื่อเพลง)</small></label>
                    <input type="text" id="addThemeSong" placeholder="e.g. Dandelions - Ruth B.">
                </div>
                <div class="col-md-6 form-group mb-0">
                    <label>Song URL <small>(ลิงก์ YouTube)</small></label>
                    <input type="text" id="addSongLink" placeholder="https://youtu.be/...">
                </div>
            </div>

            <div class="form-group">
                <label>Detailed Relationship</label>
                <input type="text" id="addDetailRel" placeholder="e.g. คนรักที่ต่างฝ่ายต่างคลั่งรักกันมาก">
            </div>

            <div class="row" style="background: rgba(24ce, 147, 216, 0.1); padding: 10px; border-radius: 15px; margin-bottom: 15px;">
                <div class="col-md-4 form-group mb-0">
                    <label>💖 Love (%)</label>
                    <input type="number" id="addLove" placeholder="0-100" min="0" max="100" value="100">
                </div>
                <div class="col-md-4 form-group mb-0">
                    <label>🔗 Bond (%)</label>
                    <input type="number" id="addBond" placeholder="0-100" min="0" max="100" value="100">
                </div>
                <div class="col-md-4 form-group mb-0">
                    <label>💔 Hate (%)</label>
                    <input type="number" id="addHate" placeholder="0-100" min="0" max="100" value="0">
                </div>
            </div>

        // JAVASCRIPT เพลง (เล่นผ่าน Iframe ซ่อนตัว)

        function toggleSong(url, iconId) {
            const player = document.getElementById('hiddenPlayer');
            const iconElement = document.getElementById(iconId);

            if (currentPlayingUrl === url) {
                player.innerHTML = '';
                currentPlayingUrl = null;
                iconElement.className = 'fas fa-play-circle play-icon';
                return;
            }

            document.querySelectorAll('.play-icon').forEach(btn => btn.className = 'fas fa-play-circle play-icon');

            let ytId = "";
            if (url.includes("youtu.be/")) {
                ytId = url.split("youtu.be/")[1].split("?")[0];
            } else if (url.includes("youtube.com/watch?v=")) {
                ytId = url.split("v=")[1].split("&")[0];
            } else if (url.includes("youtube.com/embed/")) {
                ytId = url.split("embed/")[1].split("?")[0];
            }

            if (ytId) {
                player.innerHTML = `<iframe width="300" height="300" src="https://www.youtube.com/embed/${ytId}?autoplay=1" allow="autoplay" frameborder="0"></iframe>`;
                currentPlayingUrl = url;
                iconElement.className = 'fas fa-stop-circle play-icon';
            } else {
                window.open(url, '_blank');
            }
        }

        // =========================================================================
        // STORY MODAL SCRIPTS (ระบบแสดงเครดิตนักวาดเพิ่ม)
        // =========================================================================
        function openStory(index) {
            const item = currentFilteredData[index];
            
            let titleText = item.is3P ? `${item.canon.split('&')[0].trim()} x ${item.oc} x ${item.canon.split('&')[1].trim()}` : `${item.oc} x ${item.canon}`;
            document.getElementById('storyTitle').innerText = titleText;
            
            let ocH = item.ocHeight || "N/A";
            let heightsHtml = `<span class="height-tag"><i class="fas fa-ruler-vertical"></i> ${item.oc}: ${ocH}</span>`;
            
            if(item.is3P) {
                let cNames = item.canon.split('&'); 
                let cHs = (item.canonHeight || "-,-").split(',');
                let h1 = cHs[0] ? cHs[0].trim() : "N/A";
                let h2 = cHs[1] ? cHs[1].trim() : "N/A";
                heightsHtml += `<span class="height-tag"><i class="fas fa-ruler-vertical"></i> ${cNames[0].trim()}: ${h1}</span>`;
                heightsHtml += `<span class="height-tag"><i class="fas fa-ruler-vertical"></i> ${cNames[1].trim()}: ${h2}</span>`;
            } else {
                let cH = item.canonHeight || "N/A";
                heightsHtml += `<span class="height-tag"><i class="fas fa-ruler-vertical"></i> ${item.canon}: ${cH}</span>`;
            }
            document.getElementById('storyHeights').innerHTML = heightsHtml;
            document.getElementById('storyDetailRel').innerHTML = `<strong>Relationship:</strong> ${item.detailRel || "ยังไม่ได้ระบุความสัมพันธ์แบบละเอียดค่ะ 🥺"}`;

            let love = item.loveLevel !== undefined ? item.loveLevel : 0;
            let bond = item.bondLevel !== undefined ? item.bondLevel : 0;
            let hate = item.hateLevel !== undefined ? item.hateLevel : 0;

            document.getElementById('valLove').innerText = love + '%'; document.getElementById('valBond').innerText = bond + '%'; document.getElementById('valHate').innerText = hate + '%';
            document.getElementById('barLove').style.width = '0%'; document.getElementById('barBond').style.width = '0%'; document.getElementById('barHate').style.width = '0%';

            const textElement = document.getElementById('storyText');
            if(item.story && item.story.trim() !== "") {
                textElement.innerHTML = item.story; textElement.style.textAlign = "left";
            } else {
                textElement.innerHTML = `<div style="text-align:center; padding: 20px 0;"><i class="fas fa-pen-nib mb-3" style="font-size:2.5rem; color:#e1bee7;"></i><br>ยังไม่ได้เขียนสตอรี่ของคู่นี้ค่ะ 🥺</div>`;
            }
            
            // สร้างกล่องเครดิตนักวาด (Art Credits)
            let creditHtml = '';
            let hasOcCredit = item.creditOc && item.creditOc !== "-";
            let hasCanonCredit = item.creditCanon && item.creditCanon !== "-";

            if (hasOcCredit || hasCanonCredit) {
                creditHtml += `<div class="credit-box"><i class="fas fa-palette mr-1"></i> <strong>Art Credits:</strong><br>`;
                
                if (hasOcCredit) {
                    let linkAttr = (item.linkCreditOc && item.linkCreditOc !== "-" && item.linkCreditOc !== "") ? `href="${item.linkCreditOc}" target="_blank"` : `href="javascript:void(0)"`;
                    creditHtml += `OC: <a ${linkAttr} class="credit-link">${item.creditOc}</a>`;
                }
                
                if (hasOcCredit && hasCanonCredit) creditHtml += ` &nbsp;|&nbsp; `;
                
                if (hasCanonCredit) {
                    let linkAttr2 = (item.linkCreditCanon && item.linkCreditCanon !== "-" && item.linkCreditCanon !== "") ? `href="${item.linkCreditCanon}" target="_blank"` : `href="javascript:void(0)"`;
                    creditHtml += `Canon: <a ${linkAttr2} class="credit-link">${item.creditCanon}</a>`;
                }
                
                creditHtml += `</div>`;
            }
            document.getElementById('storyCredits').innerHTML = creditHtml;
            
            document.getElementById('storyModal').style.display = 'block';
            setTimeout(() => { document.getElementById('barLove').style.width = love + '%'; document.getElementById('barBond').style.width = bond + '%'; document.getElementById('barHate').style.width = hate + '%'; }, 100);
        }

            for (let i = 0; i < 25; i++) { let flake = document.createElement('div'); flake.className = 'snowflake'; flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)]; flake.style.left = Math.random() * 100 + 'vw'; let size = Math.random() * 1.5 + 0.8; flake.style.fontSize = size + 'rem'; flake.style.animationDuration = ((Math.random() * 5 + 8) / (size * 0.8)) + 's, ' + (((Math.random() * 5 + 8) / (size * 0.8))/1.5) + 's'; flake.style.animationDelay = Math.random() * 5 + 's, ' + Math.random() * 5 + 's'; flake.style.opacity = Math.random() * 0.4 + 0.3; flake.style.color = ['rgba(206, 147, 216, 0.8)', 'rgba(186, 104, 200, 0.8)', 'rgba(255, 255, 255, 0.9)'][Math.floor(Math.random() * 3)]; container.appendChild(flake); }
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            createParticles(); populateDropdowns(); applyFilters();
            const blobs = document.querySelectorAll('.liquid-blob');
            document.body.addEventListener('mousemove', (e) => { const x = e.clientX / window.innerWidth, y = e.clientY / window.innerHeight; blobs.forEach((blob, index) => { const speed = (index + 1) * 12; blob.style.transform = `translate(${(0.5 - x) * speed}px, ${(0.5 - y) * speed}px)`; }); });
        });
    </script>
</body>
