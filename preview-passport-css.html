<head>
    <meta charset="UTF-8">

    <title>Live Preview 💖 | Liquid Glass</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0; padding: 2rem 1rem; min-height: 100vh;
            font-family: 'Krub', sans-serif; color: #5c4b51;
            background-color: #fffafb; position: relative; overflow-x: hidden;
        }

        /* Liquid Background */
        .liquid-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0; overflow: hidden; pointer-events: none;
            background: linear-gradient(135deg, #fff0f5 0%, #fdfbfb 50%, #ffe4e1 100%);
        }
        .liquid-blob {
            position: absolute; filter: blur(60px); opacity: 0.6;
            animation: morphLiquid 15s ease-in-out infinite alternate, floatLiquid 20s linear infinite;
        }
        .blob-pink {
            background: linear-gradient(120deg, #ff9a9e 0%, #fecfef 100%);
            width: 500px; height: 500px; top: -10%; left: -5%;
        }
        .blob-white {
            background: linear-gradient(120deg, #ffffff 0%, #fff1eb 100%);
            width: 600px; height: 600px; bottom: -20%; right: -10%; animation-delay: -5s;
        }

        @keyframes morphLiquid {
            0% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
            100% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
        }
        @keyframes floatLiquid {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Snow Particles */
        .snow-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .snowflake {
            position: absolute; top: -10%; color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); user-select: none;
            animation-name: fall, sway; animation-iteration-count: infinite;
            animation-timing-function: linear, ease-in-out;
        }
        @keyframes fall { 0% { top: -10%; } 100% { top: 110%; } }
        @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(25px); } }

        /* Top Bar (Glass) */
        .top-glass-bar {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(244, 143, 177, 0.15);
            border-radius: 20px; padding: 1.5rem; max-width: 900px;
            margin: 0 auto 2rem auto; text-align: center;
            position: relative; z-index: 2;
        }

        .btn-back-home {
            display: inline-block; background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 20px;
            color: #d81b60; font-weight: 600; padding: 8px 20px; margin-bottom: 10px;
            transition: all 0.3s ease; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-back-home:hover { background: #fce4ec; transform: translateY(-2px); color: #c2185b; text-decoration: none; }

        /* Preview Canvas */
        .preview-canvas {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-top: 2px solid rgba(255, 255, 255, 0.9);
            border-left: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 25px 45px rgba(0, 0, 0, 0.05),
                inset 0 0 30px rgba(255, 255, 255, 0.5);
            max-width: 900px; margin: 0 auto; padding: 40px;
            border-radius: 30px;
            position: relative; z-index: 2;
        }

/* -- first import the font -- you can use this base URL, just change the font name --  */
@import url('https://fonts.googleapis.com/css?family=Kodchasan:300,400,500,600,700,800');

   ANIMAL CROSSING ADOPT PASSPORT (MUTED PINK THEME)

.ac-single-passport {

.ac-pass-inner {

    border-radius: 15px;
    padding: 25px;
    position: relative;
}

/* Header */
.ac-pass-header {

    align-items: center;
    justify-content: center;
    color: #c49eb0; /* สีตัวหนังสือ PASSPORT (ชมพูอมม่วงตุ่นๆ) */
    font-weight: bold;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}
.ac-pass-header::before, .ac-pass-header::after {
    content: "";
    flex: 1;
    border-bottom: 2px solid #c49eb0; /* สีเส้นข้างๆ PASSPORT */
    margin: 0 20px;
    max-width: 60px;
}

/* Body (Muted Pink Banner) */
.ac-pass-body {
    background-color: #ead3db; /* สีพื้นหลังแถบข้อมูล (ชมพูหม่นอ่อนๆ) */
    border-radius: 12px;
    display: flex;
    padding: 25px;
    margin-bottom: 25px;
    background-size: cover;
}

/* Avatar & Signature Column */
.ac-pass-left-col {
    flex: 0 0 160px;
    margin-right: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.ac-pass-avatar-img {
    width: 160px;
    height: 160px;
    background-color: #ffffff; /* สีพื้นหลังกรอบรูป */
    border-radius: 25px;
    padding: 8px;
    box-sizing: border-box;
    background-clip: content-box;
    background-size: cover;
    background-position: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}

/* Signature Area */
.ac-pass-signature {
    margin-top: 15px;
    width: 140px;
    height: 50px;
    border-bottom: 1px solid rgba(196, 158, 176, 0.5); /* สีเส้นบรรทัดเซ็นชื่อ */
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 2px;
}
.ac-pass-signature img {
    max-width: 100%;
    max-height: 45px;
    object-fit: contain;
}
.ac-pass-sig-label {
    font-size: 10px;
    color: #c49eb0; /* สีคำว่า Signature */
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Info Area */
.ac-pass-info-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

/* Data Rows */
.ac-pass-row {
    border-bottom: 2px solid rgba(255,255,255,0.7); /* สีเส้นคั่นข้อมูล */
    padding: 10px 0;
    color: #6a5e62; /* สีข้อความทั่วไป (เทาอมม่วงเข้ม) */
}
.ac-pass-row:first-child {
    padding-top: 0;
}
.ac-pass-row:last-child { 
    border-bottom: none; 
    padding-bottom: 0;
}

.ac-pass-title { font-weight: bold; font-size: 15px; }
.ac-pass-name { font-size: 22px; font-weight: bold; }

/* Official Details Formatting */
.ac-pass-details {
    display: flex;
    font-size: 13.5px;
}
.ac-pass-details strong {
    color: #b3889b; /* สีหัวข้อข้อมูล (ชมพูตุ่นเข้มขึ้นนิดหน่อย) */
    margin-right: 6px;
    font-weight: bold;
}
.ac-col-half {
    flex: 1;
}

/* Footer */
.ac-pass-footer {
    display: flex;
    justify-content: space-between;
    color: #b5a0a9; /* สีรหัส SW และลูกศร */
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 0 10px;
}
.ac-pass-arrows { letter-spacing: 6px; }

/* Mobile Responsive */
@media (max-width: 600px) {
    .ac-pass-body { flex-direction: column; align-items: center; }
    .ac-pass-left-col { margin-right: 0; margin-bottom: 20px; }
    .ac-pass-details { flex-direction: column; gap: 8px; }
}

    </style>

    <script>
        function createParticles() {
            const container = document.getElementById('snow-container');
            const symbols = ['🌸', '🎀', '💖', '✨', '☁️', '🤍']; 
            for (let i = 0; i < 25; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                let size = Math.random() * 1.5 + 0.8;
                flake.style.fontSize = size + 'rem'; 
                let fallDuration = (Math.random() * 5 + 8) / (size * 0.8); 
                flake.style.animationDuration = fallDuration + 's, ' + (fallDuration/1.5) + 's';
                flake.style.animationDelay = Math.random() * 5 + 's, ' + Math.random() * 5 + 's';
                flake.style.opacity = Math.random() * 0.4 + 0.3; 
                container.appendChild(flake);
            }
        }
        createParticles();
    </script>
