        body {
            margin: 0; padding: 2rem 1rem; min-height: 100vh;
            font-family: 'Krub', sans-serif; color: #5c4b51;
            display: flex; justify-content: center; align-items: center;
            background-color: #fffafb; position: relative; overflow-x: hidden;
        }

        /* Liquid Background */
        .liquid-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0; overflow: hidden; pointer-events: none;
            background: linear-gradient(135deg, #fff0f5 0%, #fdfbfb 50%, #ffe4e1 100%);
        }
        .liquid-blob {
            position: absolute; filter: blur(60px); opacity: 0.6;
            animation: morphLiquid 15s ease-in-out infinite alternate, floatLiquid 20s linear infinite;
        }
        .blob-pink {
            background: linear-gradient(120deg, #ff9a9e 0%, #fecfef 100%);
            width: 500px; height: 500px; top: -10%; left: -5%;
        }
        .blob-white {
            background: linear-gradient(120deg, #ffffff 0%, #fff1eb 100%);
            width: 600px; height: 600px; bottom: -20%; right: -10%; animation-delay: -5s;
        }
        .blob-peach {
            background: linear-gradient(120deg, #ffd194 0%, #70e1f5 100%);
            width: 350px; height: 350px; top: 40%; left: 50%; opacity: 0.4; animation-delay: -10s;
        }

        @keyframes morphLiquid {
            0% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
            100% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
        }
        @keyframes floatLiquid {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Snow Particles */
        .snow-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .snowflake {
            position: absolute; top: -10%; color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); user-select: none;
            animation-name: fall, sway; animation-iteration-count: infinite;
            animation-timing-function: linear, ease-in-out;
        }
        @keyframes fall { 0% { top: -10%; } 100% { top: 110%; } }
        @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(25px); } }

        /* Glass Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 2px solid rgba(255, 255, 255, 1);
            border-left: 2px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.05), inset 0 0 30px rgba(255, 255, 255, 0.5);
            border-radius: 30px; padding: 2.5rem; width: 100%; max-width: 800px;
            position: relative; z-index: 2;
        }
        
        h2 { color: #d81b60; text-align: center; margin-top: 0; font-weight: 700; text-shadow: 0 2px 5px rgba(255,255,255,0.8); }

        /* Textarea (กล่องโค้ดแบบกระจก) */
        textarea {
            width: 100%; height: 350px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 15px; padding: 15px;
            font-family: monospace; font-size: 14px; color: #880e4f;
            resize: vertical; outline: none; box-sizing: border-box;
            box-shadow: inset 0 0 10px rgba(244, 143, 177, 0.1);
            transition: 0.3s;
        }
        textarea:focus { border-color: #f48fb1; background: rgba(255, 255, 255, 0.8); }

        /* Buttons */
        .btn-glass-solid {
            background: linear-gradient(135deg, #f48fb1, #d81b60);
            color: white; border: none; border-radius: 15px; font-weight: 600; font-size: 1rem;
            padding: 12px 20px; cursor: pointer; transition: all 0.3s ease; width: 100%; margin-top: 15px;
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.2);
        }
        .btn-glass-solid:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(216, 27, 96, 0.3); }

        .btn-back-home {
            display: inline-block; text-align: center; margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px; color: #d81b60; font-weight: 600; padding: 8px 20px;
            transition: all 0.3s ease; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05);

        .btn-back-home:hover { background: rgba(255, 255, 255, 0.9); transform: translateY(-2px); color: #c2185b; }

    </style>

    <script>
        function copyCode() {
            const codeBox = document.getElementById("myCodeBox");
            codeBox.select();
            codeBox.setSelectionRange(0, 99999); 
            
            navigator.clipboard.writeText(codeBox.value).then(() => {
                const alertMsg = document.getElementById("alert-msg");
                alertMsg.style.display = "block";
                setTimeout(() => { alertMsg.style.display = "none"; }, 3000);
            });
        }

        // เอฟเฟกต์หิมะ
        function createParticles() {
            const container = document.getElementById('snow-container');
            const symbols = ['🌸', '🎀', '💖', '✨', '☁️', '🤍']; 
            for (let i = 0; i < 25; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                let size = Math.random() * 1.5 + 0.8;
                flake.style.fontSize = size + 'rem'; 
                let fallDuration = (Math.random() * 5 + 8) / (size * 0.8); 
                flake.style.animationDuration = fallDuration + 's, ' + (fallDuration/1.5) + 's';
                flake.style.animationDelay = Math.random() * 5 + 's, ' + Math.random() * 5 + 's';
                flake.style.opacity = Math.random() * 0.4 + 0.3; 
                container.appendChild(flake);
            }
        }
        createParticles();
    </script>
