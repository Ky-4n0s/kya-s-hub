<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Code 💖</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%);
            font-family: 'Krub', sans-serif;
            color: #5c4b51;
            margin: 0; padding: 2rem 1rem;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #fce4ec;
            box-shadow: 0 10px 30px rgba(244, 143, 177, 0.2);
            border-radius: 20px;
            padding: 2rem;
            width: 100%; max-width: 800px;
        }
        h2 { color: #d81b60; text-align: center; margin-top: 0; }
        
        /* กล่องใส่โค้ด */
        textarea {
            width: 100%; height: 400px;
            background-color: #fdfafb;
            border: 2px dashed #f8bbd0;
            border-radius: 12px;
            padding: 15px;
            font-family: monospace;
            font-size: 14px; color: #880e4f;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
        }
        textarea:focus { border-color: #f48fb1; }

        .btn-pink {
            background-color: #f48fb1; color: white; border: none;
            border-radius: 12px; font-weight: 600; font-size: 1rem;
            padding: 12px 20px; cursor: pointer; transition: 0.2s;
            width: 100%; margin-top: 15px;
        }
        .btn-pink:hover { background-color: #d81b60; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="container">
        <!-- เปลี่ยนชื่อโค้ดตรงนี้ -->
        <h2>🎫 Adoptable Passport (HTML Only)</h2>
        <p style="text-align: center; color: #880e4f;">กดปุ่ม Copy ด้านล่าง แล้วนำไปวางในช่อง Profile ได้เลยค่ะ 🎀</p>
        
        <!-- ==============================================
             เอาโค้ดพาสปอร์ตของคุณ มาวางระหว่างแท็บ <textarea> นี้นะคะ
        =============================================== -->
        <textarea id="myCodeBox" readonly>

<!-- ==========================================
     ANIMAL CROSSING PASSPORT (INLINE CSS - NO EXTRA CSS NEEDED)
=========================================== -->

<div style="background-color: #f5f0f3; padding: 15px; border-radius: 10px; max-width: 650px; margin: 2rem auto;">
  
  <div style="background-color: #ffffff; border: 2px dashed #dcb8c6; border-radius: 15px; padding: 25px; position: relative;">
    
    <!-- ส่วนหัว (Header) -->
    <div style="display: flex; align-items: center; justify-content: center; color: #c49eb0; font-weight: bold; font-size: 22px; letter-spacing: 2px; margin-bottom: 25px; text-align: center;">
      <span style="flex: 1; border-bottom: 2px solid #c49eb0; margin: 0 20px; max-width: 60px;"></span>
      PASSPORT
      <span style="flex: 1; border-bottom: 2px solid #c49eb0; margin: 0 20px; max-width: 60px;"></span>
    </div>
    
    <!-- ส่วนเนื้อหา (แถบสี) -->
    <div style="background-color: #ead3db; border-radius: 12px; display: flex; flex-wrap: wrap; padding: 25px; margin-bottom: 25px;">
      
      <!-- คอลัมน์ซ้าย: รูปโปรไฟล์ & ลายเซ็น -->
      <div style="flex: 0 0 160px; margin-right: 30px; margin-bottom: 15px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;">
        
        <!-- รูปโปรไฟล์ -->
        <div style="width: 160px; height: 160px; background-color: #ffffff; border-radius: 25px; padding: 8px; box-sizing: border-box; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
          <!-- เปลี่ยนรูปลิงก์ตรง background-image -->
          <div style="width: 100%; height: 100%; border-radius: 18px; background-image: url("Link"'); background-size: cover; background-position: center;"></div>
        </div>
        
        <!-- ลายเซ็น -->
        <div style="margin-top: 15px; width: 140px; height: 50px; border-bottom: 1px solid rgba(196, 158, 176, 0.5); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px;">
          <!-- เปลี่ยนรูปลายเซ็นที่ src -->
          <img src="Link" alt="Signature" style="max-width: 100%; max-height: 45px; object-fit: contain; position: -5px 0px; ">
        </div>
        <div style="font-size: 10px; color: #c49eb0; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;">Signature</div>
      
      </div>
      
      <!-- คอลัมน์ขวา: ข้อมูลตัวละคร -->
      <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; justify-content: center;">
        
        <!-- บรรทัดที่ 1: ฉายา -->
        <div style="border-bottom: 2px solid rgba(255,255,255,0.7); padding-bottom: 10px; margin-bottom: 10px; color: #6a5e62; font-weight: bold; font-size: 15px;">
          Title
        </div>
        
        <!-- บรรทัดที่ 2: ชื่อ -->
        <div style="border-bottom: 2px solid rgba(255,255,255,0.7); padding-bottom: 10px; margin-bottom: 10px; color: #6a5e62; font-size: 22px; font-weight: bold;">
          FULL NAME
        </div>
        
        <!-- บรรทัดที่ 3: เพศ & ส่วนสูง -->
        <div style="border-bottom: 2px solid rgba(255,255,255,0.7); padding-bottom: 10px; margin-bottom: 10px; color: #6a5e62; display: flex; font-size: 13.5px;">
          <div style="flex: 1;"><strong style="color: #b3889b; margin-right: 6px;">Gender:</strong> F/M</div>
          <div style="flex: 1;"><strong style="color: #b3889b; margin-right: 6px;">Height:</strong> XXX cm</div>
        </div>
        
        <!-- บรรทัดที่ 4: AU & เมืองเกิด -->
        <div style="border-bottom: 2px solid rgba(255,255,255,0.7); padding-bottom: 10px; margin-bottom: 10px; color: #6a5e62; display: flex; font-size: 13.5px;">
          <div style="flex: 1;"><strong style="color: #b3889b; margin-right: 6px;">Race:</strong> n/a</div>
          <div style="flex: 1;"><strong style="color: #b3889b; margin-right: 6px;">Hometown:</strong> n/a</div>
        </div>
        
        <!-- บรรทัดที่ 5: วันเกิด & วันออกบัตร -->
        <div style="color: #6a5e62; display: flex; font-size: 13.5px;">
          <div style="flex: 1;"><strong style="color: #b3889b; margin-right: 6px;">D.O.B:</strong> DD/MM</div>
          <div style="flex: 1;"><strong style="color: #b3889b; margin-right: 6px;">Issued:</strong> DD/MM/YYYY</div>
        </div>

      </div>
    </div>
    
    <!-- ส่วนท้าย (รหัส SW) -->
    <div style="display: flex; justify-content: space-between; color: #b5a0a9; font-weight: bold; font-size: 14px; letter-spacing: 2px; padding: 0 10px;">
      <!-- ใส่รหัสที่ได้จากเว็บเจนตรงนี้เลยค่ะ -->
      <span>SW-0000-0000-0000</span>
      <span style="letter-spacing: 6px;">< < < < < < < < < <</span>
    </div>
    
  </div>
</div>

        </textarea>
        <!-- ============================================== -->

        <button class="btn-pink" onclick="copyCode()">
            <i class="fas fa-copy"></i> ก๊อปปี้โค้ดทั้งหมด (Copy All)
        </button>
        <p id="alert-msg" style="color: #4caf50; text-align: center; font-weight: 600; display: none; margin-top: 10px;">
            <i class="fas fa-check-circle"></i> ก๊อปปี้เรียบร้อยแล้วค่ะ!
        </p>
    </div>

    <script>
        function copyCode() {
            // เลือกข้อความในกล่อง
            const codeBox = document.getElementById("myCodeBox");
            codeBox.select();
            codeBox.setSelectionRange(0, 99999); // สำหรับมือถือ
            
            // ก๊อปปี้ลง Clipboard
            navigator.clipboard.writeText(codeBox.value).then(() => {
                // โชว์ข้อความว่าก๊อปปี้สำเร็จ
                const alertMsg = document.getElementById("alert-msg");
                alertMsg.style.display = "block";
                setTimeout(() => { alertMsg.style.display = "none"; }, 3000);
            });
        }
    </script>
</body>
</html>
