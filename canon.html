<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canon List 🌈 | Liquid Glass</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. BASE STYLES & RAINBOW LIQUID BACKGROUND
           ========================================================================== */
        body { margin: 0; padding: 3rem 1rem; min-height: 100vh; font-family: 'Krub', sans-serif; color: #4a3b52; position: relative; overflow-x: hidden; }
        
        /* Holographic Gradient Animation */
        .liquid-bg { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; pointer-events: none; 
            background: linear-gradient(125deg, #ffeaec, #f3e5f5, #e3f2fd, #e8f5e9, #fff9c4);
            background-size: 300% 300%;
            animation: holoFlow 15s ease infinite;
        }

        @keyframes holoFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .liquid-blob { position: absolute; filter: blur(70px); opacity: 0.6; animation: morphLiquid 15s ease-in-out infinite alternate, floatLiquid 20s linear infinite; mix-blend-mode: multiply; }
        .blob-pink { background: linear-gradient(120deg, #ffcdd2 0%, #f8bbd0 100%); width: 450px; height: 450px; top: -10%; left: -5%; }
        .blob-yellow { background: linear-gradient(120deg, #fff9c4 0%, #ffe082 100%); width: 400px; height: 400px; top: 20%; right: -10%; animation-delay: -3s; }
        .blob-blue { background: linear-gradient(120deg, #bbdefb 0%, #b3e5fc 100%); width: 500px; height: 500px; bottom: -10%; left: 10%; animation-delay: -7s; }
        .blob-purple { background: linear-gradient(120deg, #e1bee7 0%, #d1c4e9 100%); width: 350px; height: 350px; bottom: 20%; right: 20%; animation-delay: -11s; }

        @keyframes morphLiquid { 0% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; } 34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; } 67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; } 100% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; } }
        @keyframes floatLiquid { 0% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(30px, -50px) rotate(120deg); } 66% { transform: translate(-20px, 20px) rotate(240deg); } 100% { transform: translate(0, 0) rotate(360deg); } }

        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.3); } ::-webkit-scrollbar-thumb { background: #ce93d8; border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: #ba68c8; }
        .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .snowflake { position: absolute; top: -10%; color: rgba(255, 255, 255, 0.9); text-shadow: 0 0 10px rgba(255, 255, 255, 0.8); user-select: none; animation-name: fall, sway; animation-iteration-count: infinite; animation-timing-function: linear, ease-in-out; }
        @keyframes fall { 0% { top: -10%; } 100% { top: 110%; } } @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(25px); } }

        /* ==========================================================================
           2. MAIN PANELS & FILTERS
           ========================================================================== */
        .glass-panel { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.8); border-top: 2px solid rgba(255, 255, 255, 1); border-left: 2px solid rgba(255, 255, 255, 1); box-shadow: 0 25px 45px rgba(0, 0, 0, 0.05), inset 0 0 30px rgba(255, 255, 255, 0.6); border-radius: 40px; padding: 3rem 2.5rem; max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
        .btn-back-home { display: inline-block; background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 1); border-radius: 20px; color: #8e24aa; font-weight: 600; padding: 8px 25px; margin-bottom: 20px; transition: all 0.3s ease; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .btn-back-home:hover { background: rgba(255, 255, 255, 1); transform: translateY(-2px); color: #6a1b9a; text-decoration: none; }
        
        /* ปรับสี Title ให้ออกพาสเทลละมุนขึ้น */
        .header-title { text-align: center; font-weight: 800; font-size: 3rem; margin-bottom: 5px; cursor: pointer; background: linear-gradient(45deg, #f48fb1, #b39ddb, #81d4fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0px 2px 2px rgba(255,255,255,0.9)); }
        .header-desc { text-align: center; color: #7e57c2; font-size: 1rem; margin-bottom: 1.5rem; font-weight: 600; opacity: 0.9; }
        
        .filter-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 3rem; flex-wrap: wrap; background: rgba(255, 255, 255, 0.5); padding: 15px 25px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.8); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); }
        .filter-dropdown { background: rgba(255, 255, 255, 0.9); border: 1px solid #f3e5f5; color: #7b1fa2; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-family: 'Krub', sans-serif; outline: none; cursor: pointer; transition: 0.3s; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04); }
        .filter-dropdown:focus { border-color: #ce93d8; box-shadow: 0 0 10px rgba(206, 147, 216, 0.2); }
        
        .filter-belove-toggle { background: rgba(255, 255, 255, 0.9); border: 1px solid #f8bbd0; color: #d81b60; padding: 8px 18px; border-radius: 20px; font-weight: 700; font-family: 'Krub', sans-serif; cursor: pointer; transition: 0.3s; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(216, 27, 96, 0.08); display: flex; align-items: center; gap: 8px; user-select: none; }
        .filter-belove-toggle:hover { background: #fce4ec; } .filter-belove-toggle input { display: none; }
        .filter-belove-toggle.active { background: linear-gradient(135deg, #f48fb1, #f06292); color: white; border-color: #f06292; box-shadow: 0 4px 12px rgba(240, 98, 146, 0.3); }
        .total-badge { background: linear-gradient(135deg, #f3e5f5, #e3f2fd); color: #6a1b9a; padding: 10px 20px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; border: 1px solid #e1bee7; }

        /* ==========================================================================
           3. CANON GRID & GLASSY BADGES
           ========================================================================== */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; padding: 10px; }
        
        .canon-card { 
            background: rgba(255, 255, 255, 0.4); border-radius: 25px; position: relative; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); transition: all 0.3s ease; 
            border: 3px solid rgba(255, 255, 255, 0.9); aspect-ratio: 1 / 1;
        }
        .canon-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(106, 27, 154, 0.2); border-color: #e1bee7; }
        
        .img-wrapper { width: 100%; height: 100%; border-radius: 20px; overflow: hidden; position: relative; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .canon-card:hover .img-wrapper img { transform: scale(1.08); }
        
        /* ป้ายชื่อด้อมแบบกระจก (Glassmorphism Pastel) */
        .fandom-badge { 
            position: absolute; top: -12px; right: -12px; 
            background: rgba(255, 255, 255, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #7b1fa2; font-size: 0.75rem; font-weight: 700; padding: 5px 15px; border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1), inset 0 0 10px rgba(255,255,255,0.8); 
            border: 1.5px solid rgba(255, 255, 255, 0.9); white-space: nowrap; z-index: 10;
        }
        
        /* กลุ่มป้ายสัญลักษณ์มุมซ้ายล่าง (ไม่คร่อมกรอบ) */
        .badge-group-bottom { position: absolute; bottom: 10px; left: 10px; display: flex; gap: 6px; z-index: 10; }
        
        /* สไตล์ไอคอนแบบกระจกใสพาสเทล */
        .icon-dot { 
            width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            font-size: 0.85rem; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15), inset 0 0 8px rgba(255,255,255,0.7); 
            border: 1.5px solid rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        
        /* สีพาสเทลกระจกใสๆ ของแต่ละสถานะ */
        .bg-belove { background: rgba(248, 187, 208, 0.75); color: #d81b60; } /* Pastel Pink */
        .bg-non { background: rgba(255, 205, 210, 0.8); color: #c62828; }    /* Pastel Red */
        .bg-hard { background: rgba(225, 190, 231, 0.8); color: #6a1b9a; }   /* Pastel Purple */
        .bg-sel { background: rgba(255, 224, 178, 0.8); color: #e65100; }    /* Pastel Orange */
        .bg-mirror { background: rgba(179, 229, 252, 0.8); color: #0277bd; } /* Pastel Blue */
        .bg-free { background: rgba(200, 230, 201, 0.8); color: #2e7d32; }   /* Pastel Green */

        /* ==========================================================================
           4. MODAL STYLES (Admin & Story)
           ========================================================================== */
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: 9999; }
        .admin-content { background: rgba(255, 255, 255, 0.95); border-radius: 30px; padding: 2.5rem; width: 95%; max-width: 600px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px solid rgba(255, 255, 255, 1); box-shadow: 0 25px 45px rgba(106, 27, 154, 0.15); max-height: 90vh; overflow-y: auto; }
        .admin-title { color: #7b1fa2; font-weight: 700; text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
        .form-group { margin-bottom: 15px; } .form-group label { display: block; font-size: 0.9rem; color: #6a1b9a; font-weight: 700; margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid #e1bee7; background: #fff; color: #4a3b52; font-family: 'Krub', sans-serif; outline: none; transition: 0.3s; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #ce93d8; box-shadow: 0 0 10px rgba(206, 147, 216, 0.2); }
        .btn-generate { background: linear-gradient(135deg, #ce93d8, #ba68c8); color: white; width: 100%; padding: 12px; border: none; border-radius: 15px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(186, 104, 200, 0.3); }
        .result-code { width: 100%; height: 100px; margin-top: 15px; padding: 10px; border-radius: 12px; border: 1px dashed #ba68c8; background: #fdf5f9; font-family: monospace; font-size: 0.8rem; color: #4a148c; resize: none; outline: none; }
        .close-admin { position: absolute; top: 20px; right: 25px; font-size: 1.5rem; color: #ba68c8; cursor: pointer; transition: 0.3s; } .close-admin:hover { color: #7b1fa2; }

        /* Pop-up ข้อมูลแคนน่อน */
        .story-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .story-img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 10px 25px rgba(0,0,0,0.15); margin-bottom: 15px; }
        .story-title { color: #c2185b; font-weight: 800; margin-bottom: 5px; font-size: 1.8rem; text-align: center; }
        .story-fandom { color: #7b1fa2; font-weight: 600; font-size: 0.95rem; margin-bottom: 15px; background: #f3e5f5; padding: 4px 15px; border-radius: 20px;}
        
        .badges-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        
        /* ป้ายแบบกระจกพาสเทลในหน้าต่าง Pop-up */
        .badge-info { 
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: #6a1b9a; padding: 6px 15px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; 
            border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        .badge-info-belove { background: rgba(248, 187, 208, 0.4); color: #d81b60; }
        
        .note-box { background: rgba(255,255,255,0.7); border-radius: 15px; padding: 20px; border: 1px dashed #ce93d8; text-align: left; }
        .note-title { font-size: 0.9rem; font-weight: 700; color: #8e24aa; margin-bottom: 10px; display: flex; align-items: center; gap: 5px; }
        .note-text { font-size: 0.95rem; line-height: 1.6; color: #4a3b52; }
    </style>
</head>
<body>

    <div class="liquid-bg">
        <div class="liquid-blob blob-purple"></div>
        <div class="liquid-blob blob-lavender"></div>
        <div class="liquid-blob blob-pink"></div>
        <div class="liquid-blob blob-yellow"></div>
        <div class="liquid-blob blob-blue"></div>
    </div>

    <div class="snow-container" id="snow-container"></div>

    <div class="glass-panel">
        
        <div class="text-center">
            <a href="index.html" class="btn-back-home"><i class="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก (Hub)</a>
        </div>

        <h1 class="header-title" ondblclick="openAdminPrompt()">All Canons 🌈</h1>
        <p class="header-desc">คลังรวมเมนคนโปรดทั้งหมดค่ะ ✨</p>

        <!-- Filters -->
        <div class="filter-controls">
            <select id="filterFandom" class="filter-dropdown" onchange="applyFilters()">
                <option value="All">All Fandoms</option>
            </select>
            <select id="filterSharing" class="filter-dropdown" onchange="applyFilters()">
                <option value="All">🔒 All Sharing Status</option>
                <option value="Non Sharing">🚫 Non Sharing</option>
                <option value="Hard Selective">🔒 Hard Selective</option>
                <option value="Selective">⚠️ Selective</option>
                <option value="Mirror Sharing">🪞 Mirror Sharing</option>
                <option value="Free">✅ Free Sharing</option>
            </select>
            
            <label class="filter-belove-toggle" id="btnBelove" onclick="toggleBeloveFilter()">
                <input type="checkbox" id="filterBelove">
                💖 My belove
            </label>

            <div class="total-badge" id="totalCount">Total: 0 Characters</div>
        </div>

        <!-- กริดสำหรับโชว์แค่รูปภาพ -->
        <div class="card-grid" id="cardContainer"></div>
    </div>

    <!-- ==========================================
         ADMIN MODAL
         ========================================== -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <i class="fas fa-times close-admin" onclick="closeAdmin()"></i>
            <h2 class="admin-title"><i class="fas fa-magic"></i> Add Canon</h2>
            
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>Canon Name</label>
                    <input type="text" id="addName" placeholder="e.g. Albedo">
                </div>
                <div class="col-md-6 form-group">
                    <label>Fandom</label>
                    <input type="text" id="addFandom" placeholder="e.g. Genshin Impact">
                </div>
            </div>

            <div class="form-group">
                <label>Image URL</label>
                <input type="text" id="addImg" placeholder="https://...">
            </div>

            <div class="row">
                <div class="col-md-6 form-group">
                    <label>Sharing Status</label>
                    <select id="addSharing">
                        <option value="Selective">Selective</option>
                        <option value="Hard Selective">Hard Selective</option>
                        <option value="Mirror Sharing">Mirror Sharing</option>
                        <option value="Non Sharing">Non Sharing</option>
                        <option value="Free">Free</option>
                    </select>
                </div>
                <div class="col-md-6 form-group">
                    <label>Position</label>
                    <select id="addPosition">
                        <option value="-">Pos (-)</option>
                        <option value="Top">Top</option>
                        <option value="Bottom">Bottom</option>
                        <option value="Switches">Switches</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Note / Headcanon <small>(เว้นว่างได้)</small></label>
                <textarea id="addNote" rows="3" placeholder="หวีดสั้นๆ พิมพ์ความกาว หรือจุดที่โดนตก... (ใช้ <br> เพื่อขึ้นบรรทัดใหม่)"></textarea>
            </div>

            <div class="form-group" style="display: flex; gap: 20px; align-items: center; margin-top: 5px;">
                <label style="margin: 0; display: flex; align-items: center; gap: 5px; cursor: pointer; color: #d81b60; font-weight: 700;">
                    <input type="checkbox" id="addMyBelove" style="width: auto;"> 💖 My belove
                </label>
            </div>

            <button class="btn-generate" onclick="generateCode()">Generate Code ✨</button>
            <textarea id="resultCode" class="result-code" readonly placeholder="โค้ดที่สร้างเสร็จแล้วจะมาโผล่ตรงนี้..."></textarea>
            <button class="btn-back-home" style="width: 100%; margin-top: 10px; text-align: center; border-radius: 12px; font-size: 0.9rem;" onclick="copyResultCode()">📋 Copy Code</button>
        </div>
    </div>

    <!-- ==========================================
         INFO MODAL (แสดงรายละเอียดเวลากดที่รูป)
         ========================================== -->
    <div class="admin-modal" id="infoModal">
        <div class="admin-content" style="max-width: 450px;">
            <i class="fas fa-times close-admin" onclick="closeInfo()"></i>
            
            <div class="story-header">
                <img src="" id="infoImg" class="story-img" alt="Profile">
                <div class="story-title" id="infoName">Name</div>
                <div class="story-fandom" id="infoFandom">Fandom</div>
            </div>
            
            <div class="badges-row" id="infoBadges"></div>

            <div class="note-box" id="infoNoteBox" style="display:none;">
                <div class="note-title"><i class="fas fa-star"></i> Note / Headcanon</div>
                <div class="note-text" id="infoNoteText">...</div>
            </div>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🌟 DATABASE
        // เพิ่ม Free Sharing ได้แล้วค่ะ
        // =========================================================================
        const canonList = [
            { 
                name: "Messmer the Impaler", 
                fandom: "Elden Ring", 
                img: "https://i.pinimg.com/736x/01/5d/0e/015d0e92b4a3465ce6fa467859f247ca.jpg", 
                sharing: "Non Sharing", 
                myBelove: true,
                position: "Top", 
                note: "บุตรแห่งไฟที่ดุดันแต่มีความอ่อนโยนซ่อนอยู่ โดนตกเพราะความจงรักภักดีของเขา"
            },
            { 
                name: "Alhaitham", 
                fandom: "Genshin Impact", 
                img: "https://via.placeholder.com/300x300/e8eaf6/3f51b5?text=Alhaitham", 
                sharing: "Selective", 
                myBelove: true,
                position: "Top", 
                note: "เสมียนสุดเนิร์ดที่ปากแจ๋วแต่พึ่งพาได้เสมอ"
            },
            { 
                name: "Aventurine", 
                fandom: "Honkai: Star Rail", 
                img: "https://i.pinimg.com/736x/d9/94/4e/d9944e080a8f32ff208bfba9614bfed0.jpg", 
                sharing: "Mirror Sharing", 
                myBelove: false,
                position: "Top", 
                note: "นักพนันหนุ่มที่เอาชีวิตเข้าแลกตลอดเวลา อยากปกป้อง🥺"
            },
            { 
                name: "Gakushu Asano", 
                fandom: "Assassination Classroom", 
                img: "https://via.placeholder.com/300x300/e8eaf6/3f51b5?text=Gakushu", 
                sharing: "Hard Selective", 
                myBelove: false,
                position: "Top", 
                note: "" 
            },
            { 
                name: "Samwell Blackwood", 
                fandom: "A Song of Ice and Fire", 
                img: "https://via.placeholder.com/300x300/e8eaf6/3f51b5?text=Samwell", 
                sharing: "Free", 
                myBelove: false,
                position: "Switches", 
                note: "หนุ่มเรเวนทรีฮอลล์ที่น่ารักที่สุด"
            }
            // สามารถก๊อปข้อมูลเมนคนอื่นๆ มาใส่ต่อจากตรงนี้ได้เลยค่ะ
        ];

        // =========================================================================
        // สคริปต์สำหรับการแสดงผลและการจัดเรียง 
        // =========================================================================
        const cardContainer = document.getElementById('cardContainer');
        const filterFandom = document.getElementById('filterFandom');
        const filterSharing = document.getElementById('filterSharing');
        const filterBeloveToggle = document.getElementById('filterBelove');
        const btnBelove = document.getElementById('btnBelove');
        const totalCount = document.getElementById('totalCount');
        
        let currentFilteredData = []; 

        function populateDropdowns() {
            const fandoms = [...new Set(canonList.map(item => item.fandom))].sort();
            fandoms.forEach(f => {
                const option = document.createElement('option');
                option.value = f; option.textContent = f;
                filterFandom.appendChild(option);
            });
        }

        function toggleBeloveFilter() {
            if(filterBeloveToggle.checked) btnBelove.classList.add('active');
            else btnBelove.classList.remove('active');
            applyFilters();
        }

        function applyFilters() {
            const selectedFandom = filterFandom.value;
            const selectedSharing = filterSharing.value;
            const showBeloveOnly = filterBeloveToggle.checked;

            currentFilteredData = canonList.filter(item => {
                const matchFandom = (selectedFandom === 'All') || (item.fandom === selectedFandom);
                const matchSharing = (selectedSharing === 'All') || (item.sharing === selectedSharing);
                const matchBelove = showBeloveOnly ? (item.myBelove === true) : true;
                return matchFandom && matchSharing && matchBelove;
            });

            totalCount.innerText = `Total: ${currentFilteredData.length} Characters`;
            cardContainer.innerHTML = '';
            
            currentFilteredData.forEach((item, index) => {
                let imgUrl = (item.img && item.img !== "-" && item.img !== "") ? item.img : `https://via.placeholder.com/300x300/e8eaf6/3f51b5?text=${item.name.replace(/ /g, '+')}`;
                
                // สัญลักษณ์ My belove (สีชมพูพาสเทลกระจก)
                let beloveIcon = item.myBelove ? `<div class="icon-dot bg-belove" title="My belove"><i class="fas fa-heart"></i></div>` : '';

                // สัญลักษณ์ Sharing สีพาสเทลแบบกระจกฝ้า
                let shareIcon = '';
                if(item.sharing === "Non Sharing") shareIcon = `<div class="icon-dot bg-non" title="Non Sharing"><i class="fas fa-ban"></i></div>`;
                else if(item.sharing === "Hard Selective") shareIcon = `<div class="icon-dot bg-hard" title="Hard Selective"><i class="fas fa-lock"></i></div>`;
                else if(item.sharing === "Selective") shareIcon = `<div class="icon-dot bg-sel" title="Selective"><i class="fas fa-lock-open"></i></div>`;
                else if(item.sharing === "Mirror Sharing") shareIcon = `<div class="icon-dot bg-mirror" title="Mirror Sharing"><i class="fas fa-people-arrows"></i></div>`;
                else if(item.sharing === "Free") shareIcon = `<div class="icon-dot bg-free" title="Free Sharing"><i class="fas fa-check"></i></div>`;

                const cardHtml = `
                    <div class="canon-card" onclick="openInfo(${index})">
                        <div class="fandom-badge">${item.fandom}</div>
                        <div class="img-wrapper">
                            <img src="${imgUrl}" alt="${item.name}">
                            <div class="badge-group-bottom">
                                ${beloveIcon}
                                ${shareIcon}
                            </div>
                        </div>
                    </div>
                `;
                cardContainer.innerHTML += cardHtml;
            });

            if (currentFilteredData.length === 0) {
                cardContainer.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: #8e24aa; padding: 2rem;">ไม่พบข้อมูลที่คุณค้นหาค่ะ 🥺</div>`;
            }
        }

        // =========================================================================
        // INFO MODAL SCRIPTS
        // =========================================================================
        function openInfo(index) {
            const item = currentFilteredData[index];
            
            let imgUrl = (item.img && item.img !== "-" && item.img !== "") ? item.img : `https://via.placeholder.com/300x300/e8eaf6/3f51b5?text=${item.name.replace(/ /g, '+')}`;
            document.getElementById('infoImg').src = imgUrl;
            document.getElementById('infoName').innerText = item.name;
            document.getElementById('infoFandom').innerText = item.fandom;

            // Badges
            let badgesHtml = '';
            
            if (item.myBelove) {
                badgesHtml += `<div class="badge-info badge-info-belove"><i class="fas fa-heart"></i> My belove</div>`;
            }

            let sIcon = '';
            if(item.sharing === "Non Sharing") sIcon = `<i class="fas fa-ban text-danger"></i> `;
            else if(item.sharing === "Hard Selective") sIcon = `<i class="fas fa-lock text-dark"></i> `;
            else if(item.sharing === "Selective") sIcon = `<i class="fas fa-lock-open text-warning"></i> `;
            else if(item.sharing === "Mirror Sharing") sIcon = `<i class="fas fa-people-arrows text-info"></i> `;
            else if(item.sharing === "Free") sIcon = `<i class="fas fa-check text-success"></i> `;
            
            if (item.sharing && item.sharing !== "-") badgesHtml += `<div class="badge-info">${sIcon}${item.sharing}</div>`;
            if (item.position && item.position !== "-") badgesHtml += `<div class="badge-info"><i class="fas fa-transgender-alt"></i> ${item.position}</div>`;
            
            document.getElementById('infoBadges').innerHTML = badgesHtml;

            // Note Box
            if(item.note && item.note.trim() !== "") {
                document.getElementById('infoNoteText').innerHTML = item.note;
                document.getElementById('infoNoteBox').style.display = 'block';
            } else {
                document.getElementById('infoNoteBox').style.display = 'none';
            }

            document.getElementById('infoModal').style.display = 'block';
        }

        function closeInfo() { document.getElementById('infoModal').style.display = 'none'; }

        // =========================================================================
        // ADMIN PANEL SCRIPTS
        // =========================================================================
        const adminPassword = "primax"; 
        function openAdminPrompt() { let pwd = prompt("🔐 กรุณาใส่รหัสผ่านเพื่อเข้าสู่ Admin Panel:"); if (pwd === adminPassword) document.getElementById('adminModal').style.display = 'block'; else if (pwd !== null) alert("รหัสผ่านไม่ถูกต้องค่ะ 🥺"); }
        function closeAdmin() { document.getElementById('adminModal').style.display = 'none'; }

        function generateCode() {
            let name = document.getElementById('addName').value || "Canon Name"; 
            let fandom = document.getElementById('addFandom').value || "Fandom Name"; 
            let img = document.getElementById('addImg').value || ""; 
            let sharing = document.getElementById('addSharing').value || "Selective"; 
            let position = document.getElementById('addPosition').value || "-"; 
            let myBelove = document.getElementById('addMyBelove').checked;
            
            let note = document.getElementById('addNote').value; 
            let formattedNote = note.replace(/\n/g, "<br>");

            let codeStr = `{ name: "${name}", fandom: "${fandom}", img: "${img}", sharing: "${sharing}", myBelove: ${myBelove}, position: "${position}", note: "${formattedNote}" },`;

            document.getElementById('resultCode').value = codeStr;
        }

        function copyResultCode() {
            let codeBox = document.getElementById('resultCode'); if(codeBox.value === "") return;
            codeBox.select(); navigator.clipboard.writeText(codeBox.value);
            alert("✅ ก๊อปปี้โค้ดเรียบร้อยแล้ว!");
        }

        function createParticles() {
            const container = document.getElementById('snow-container'); const symbols = ['✨', '🌈', '💖', '💫', '🤍', '🌸']; 
            for (let i = 0; i < 25; i++) { let flake = document.createElement('div'); flake.className = 'snowflake'; flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)]; flake.style.left = Math.random() * 100 + 'vw'; let size = Math.random() * 1.5 + 0.8; flake.style.fontSize = size + 'rem'; flake.style.animationDuration = ((Math.random() * 5 + 8) / (size * 0.8)) + 's, ' + (((Math.random() * 5 + 8) / (size * 0.8))/1.5) + 's'; flake.style.animationDelay = Math.random() * 5 + 's, ' + Math.random() * 5 + 's'; flake.style.opacity = Math.random() * 0.4 + 0.3; container.appendChild(flake); }
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            createParticles(); populateDropdowns(); applyFilters();
            const blobs = document.querySelectorAll('.liquid-blob');
            document.body.addEventListener('mousemove', (e) => { const x = e.clientX / window.innerWidth, y = e.clientY / window.innerHeight; blobs.forEach((blob, index) => { const speed = (index + 1) * 12; blob.style.transform = `translate(${(0.5 - x) * speed}px, ${(0.5 - y) * speed}px)`; }); });
        });
    </script>
</body>
</html>
