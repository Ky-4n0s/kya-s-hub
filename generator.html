<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passport ID Generator 🌟 | Liquid Glass</title>
    
    <!-- โหลด Icons, Bootstrap, ฟอนต์ -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Krub:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- โหลด jQuery และ Select2 สำหรับ Dropdown สวยๆ -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <style>
        /* ==========================================================================
           1. BASE STYLES & LIQUID BACKGROUND (โทนส้ม-เหลือง)
           ========================================================================== */
        body {
            margin: 0; padding: 2rem 1rem; min-height: 100vh;
            font-family: 'Krub', sans-serif; color: #5c4332;
            display: flex; justify-content: center; align-items: center;
            background-color: #fffaf0; position: relative; overflow-x: hidden;
        }

        .liquid-bg {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0; overflow: hidden; pointer-events: none;
            background: linear-gradient(135deg, #fff8e1 0%, #fff3e0 50%, #ffe0b2 100%);
        }

        .liquid-blob {
            position: absolute; filter: blur(60px); opacity: 0.65;
            animation: morphLiquid 15s ease-in-out infinite alternate, floatLiquid 20s linear infinite;
        }

        /* โทนสี Blob: ส้มพีช, เหลืองทอง, ส้มอ่อน */
        .blob-orange {
            background: linear-gradient(120deg, #ffb75e 0%, #ed8f03 100%);
            width: 450px; height: 450px; top: -5%; left: -5%;
        }
        .blob-yellow {
            background: linear-gradient(120deg, #fceabb 0%, #f8b500 100%);
            width: 550px; height: 550px; bottom: -15%; right: -10%; animation-delay: -5s;
        }
        .blob-peach {
            background: linear-gradient(120deg, #ffd194 0%, #ff9a9e 100%);
            width: 350px; height: 350px; top: 40%; left: 50%; opacity: 0.5; animation-delay: -10s;
        }

        @keyframes morphLiquid {
            0% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
            100% { border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%; }
        }
        @keyframes floatLiquid {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -50px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.3); }
        ::-webkit-scrollbar-thumb { background: #ffcc80; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ffa726; }

        /* ==========================================================================
           2. FOREGROUND PARTICLES
           ========================================================================== */
        .snow-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .snowflake {
            position: absolute; top: -10%; color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(255, 200, 0, 0.5); user-select: none;
            animation-name: fall, sway; animation-iteration-count: infinite;
            animation-timing-function: linear, ease-in-out;
        }
        @keyframes fall { 0% { top: -10%; } 100% { top: 110%; } }
        @keyframes sway { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(25px); } }

        /* ==========================================================================
           3. GLASS PANEL & FORMS
           ========================================================================== */
        .glass-panel {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-top: 2px solid rgba(255, 255, 255, 1);
            border-left: 2px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 45px rgba(230, 81, 0, 0.08), inset 0 0 30px rgba(255, 255, 255, 0.6);
            border-radius: 35px; padding: 2.5rem; width: 100%; max-width: 480px;
            position: relative; z-index: 2;
        }
        
        h2 { color: #e65100; text-align: center; margin-top: 0; font-weight: 700; text-shadow: 0 2px 5px rgba(255,255,255,0.9); margin-bottom: 5px;}
        .sub-heading { text-align: center; color: #f57c00; font-weight: 600; font-size: 0.9rem; margin-bottom: 20px; }

        .btn-back-home {
            display: block; width: max-content; margin: 0 auto 20px auto;
            background: rgba(255, 255, 255, 0.8); border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px; color: #f57c00; font-weight: 600; padding: 6px 20px; font-size: 0.9rem;
            transition: all 0.3s ease; text-decoration: none; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .btn-back-home:hover { background: #fff3e0; transform: translateY(-2px); color: #e65100; text-decoration: none; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #bf360c; font-weight: 700; margin-bottom: 6px; }

        /* Style สำหรับ input Date */
        input[type="date"] {
            width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.9);
            background-color: rgba(255,255,255,0.7); color: #e65100; box-sizing: border-box;
            font-family: 'Krub', sans-serif; font-weight: 600; font-size: 14px;
            transition: all 0.3s ease; outline: none; box-shadow: inset 0 0 8px rgba(255,167,38,0.1);
        }
        input[type="date"]:focus { background-color: rgba(255,255,255,0.9); border-color: #ffb74d; box-shadow: 0 0 10px rgba(255, 183, 77, 0.4); }

        /* ปรับแต่ง Select2 ให้เป็นกระจกใสโทนส้ม */
        .select2-container--default .select2-selection--single {
            background-color: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px; height: 42px; transition: all 0.3s ease; box-shadow: inset 0 0 8px rgba(255,167,38,0.1);
        }
        .select2-container--default.select2-container--open .select2-selection--single {
            background-color: rgba(255, 255, 255, 0.9); border-color: #ffb74d; box-shadow: 0 0 10px rgba(255, 183, 77, 0.4);
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: #e65100; line-height: 40px; font-weight: 600; font-family: 'Krub', sans-serif; font-size: 14px; padding-left: 12px;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow { height: 40px; }
        
        .select2-dropdown {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid #ffcc80; border-radius: 12px; box-shadow: 0 10px 25px rgba(230, 81, 0, 0.15);
        }
        .select2-results__option { font-family: 'Krub', sans-serif; font-size: 14px; color: #5c4332; }
        .select2-container--default .select2-results__option--highlighted[aria-selected] { background-color: #ffcc80; color: #e65100; font-weight: 600;}
        .select2-container--default .select2-results__group { font-weight: 700; color: #ef6c00; background-color: #fff3e0; padding: 6px 12px; }

        /* Buttons */
        .btn-glass-solid {
            background: linear-gradient(135deg, #ffb74d, #f57c00);
            color: white; border: none; border-radius: 15px; font-weight: 700; font-size: 1rem;
            padding: 12px 20px; cursor: pointer; transition: all 0.3s ease; width: 100%; margin-top: 10px;
            box-shadow: 0 5px 15px rgba(245, 124, 0, 0.25); font-family: 'Krub', sans-serif; letter-spacing: 0.5px;
        }
        .btn-glass-solid:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(245, 124, 0, 0.4); color: white;}

        /* Result Box */
        .result-box {
            margin-top: 20px; 
            background: rgba(255, 255, 255, 0.7); 
            padding: 15px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.9);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.5), 0 5px 15px rgba(0,0,0,0.02);
            transition: 0.3s;
        }
        .result-box:hover { transform: scale(1.02); border-color: #ffe0b2; }
        .result-code {
            font-size: 22px; font-weight: 700; color: #e65100;
            letter-spacing: 1.5px; margin-bottom: 5px; word-break: break-all;
        }
        .result-desc { font-size: 13px; color: #f57c00; font-weight: 600; }

        @media (max-width: 768px) {
            .glass-panel { padding: 2rem 1.5rem; border-radius: 25px; }
        }
    </style>
</head>
<body>

    <!-- Liquid Background -->
    <div class="liquid-bg">
        <div class="liquid-blob blob-orange"></div>
        <div class="liquid-blob blob-yellow"></div>
        <div class="liquid-blob blob-peach"></div>
    </div>

    <!-- Snow Particles -->
    <div class="snow-container" id="snow-container"></div>

    <div class="glass-panel">
        
        <a href="index.html" class="btn-back-home"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>

        <h2><i class="fas fa-id-card-alt"></i> Passport Gen</h2>
        <div class="sub-heading">KYA Inc. Official Identity System</div>
        
        <div class="form-group">
            <label>Setting</label>
            <select id="genSetting" class="searchable-select">
                <option value="NM">Numinar (NM)</option>
                <option value="M">Modern (M)</option>
                <option value="F">Fantasy (F)</option>
                <option value="S">Sci-Fi (S)</option>
                <option value="O">Omegaverse (O)</option>
                <option value="N">Normal (N)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Country / Region</label>
            <select id="genCity" class="searchable-select">
                <optgroup label="Setting: Numinar">
                    <option value="VT">Verithesium (VT)</option>
                    <option value="PR">Primordia (PR)</option>
                    <option value="AD">Adeptalon (AD)</option>
                    <option value="TC">Thalassocene (TC)</option>
                    <option value="NK">Nihil-Katar (NK)</option>
                    <option value="LC">Umbralis - Lacrimor (LC)</option>
                    <option value="IS">Umbralis - Insatia (IS)</option>
                    <option value="FU">Umbralis - Furian (FU)</option>
                    <option value="SM">Umbralis - Somnium (SM)</option>
                    <option value="EM">Empyrium (EM)</option>
                </optgroup>
                <optgroup label="General Worlds">
                    <option value="TH">Thailand (TH)</option>
                    <option value="JP">Japan (JP)</option>
                    <option value="UK">United Kingdom (UK)</option>
                    <option value="US">United States (US)</option>
                    <option value="KR">South Korea (KR)</option>
                    <option value="CN">China (CN)</option>
                </optgroup>
                <option value="XX">Unspecified / Other (XX)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Gender</label>
            <select id="genGender" class="searchable-select">
                <option value="F">Female (F)</option>
                <option value="M">Male (M)</option>
                <option value="N">Non-binary / Other (N)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Species</label>
            <select id="genSpecies" class="searchable-select">
                <optgroup label="Setting: Numinar">
                    <option value="PM">Numinari - Primordis (PM)</option>
                    <option value="EC">Numinari - Electari (EC)</option>
                    <option value="AP">Numinari - The Apotheori (AP)</option>
                    <option value="NL">Numinari - Nihilari (NL)</option>
                    <option value="VR">Numinari - Veritasi (VR)</option>
                    <option value="VL">The Vaelur (Elf) (VL)</option>
                    <option value="TL">The Thalassari (Mermaid) (TL)</option>
                    <option value="CL">The Caelestari (Angel) (CL)</option>
                    <option value="UM">The Umbrari (Demon) (UM)</option>
                    <option value="AT">The Aethlings (Fairy) (AT)</option>
                    <option value="VS">The Vestigi (Spirit) (VS)</option>
                </optgroup>
                <optgroup label="General Species">
                    <option value="HM">Human (HM)</option>
                    <option value="KM">Kemonomimi (KM)</option>
                    <option value="FR">Furry / Anthro (FR)</option>
                    <option value="WI">Witch / Wizard (WI)</option>
                    <option value="EL">Elf (EL)</option>
                    <option value="AN">Angel (AN)</option>
                    <option value="DE">Demon (DE)</option>
                    <option value="ME">Mermaid (ME)</option>
                    <option value="MO">Monster (MO)</option>
                </optgroup>
                <option value="XX">Other (XX)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Date of Birth (DOB)</label>
            <input type="date" id="genDate" value="2000-01-01">
        </div>

        <button class="btn-glass-solid" onclick="generateCode()">
            <i class="fas fa-magic mr-1"></i> Generate Passport ID
        </button>

        <div class="result-box">
            <div class="result-code" id="displayCode">AD-CC-XXXX-XXXX-XXXX</div>
            <div class="result-desc"><i class="fas fa-copy mr-1"></i> Copy this code to your profile!</div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // เรียกใช้ Select2 เพื่อให้ Dropdown มีช่องค้นหาและสวยงามขึ้น
            $('.searchable-select').select2({
                width: '100%',
                minimumResultsForSearch: 0
            });
            
            createParticles();
            
            // ขยับ Blob พื้นหลัง
            const glassPanel = document.querySelector('.glass-panel');
            const blobs = document.querySelectorAll('.liquid-blob');
            
            document.body.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                blobs.forEach((blob, index) => {
                    const speed = (index + 1) * 12;
                    const xOffset = (0.5 - x) * speed;
                    const yOffset = (0.5 - y) * speed;
                    blob.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
                });
            });
        });

        // เอฟเฟกต์ของตก (พระอาทิตย์ ดาว ทานตะวัน โทนส้ม-เหลือง)
        function createParticles() {
            const container = document.getElementById('snow-container');
            const symbols = ['⭐', '✨', '🌻', '💛', '☁️', '☀️', '🌼']; 
            const numFlakes = 25; 

            for (let i = 0; i < numFlakes; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                
                let size = Math.random() * 1.5 + 0.8;
                flake.style.fontSize = size + 'rem'; 
                
                let fallDuration = (Math.random() * 5 + 8) / (size * 0.8); 
                flake.style.animationDuration = fallDuration + 's, ' + (fallDuration/1.5) + 's';
                flake.style.animationDelay = Math.random() * 5 + 's, ' + Math.random() * 5 + 's';
                flake.style.opacity = Math.random() * 0.4 + 0.3; 
                
                let colors = ['rgba(255, 167, 38, 0.8)', 'rgba(255, 202, 40, 0.8)', 'rgba(255, 255, 255, 0.9)'];
                flake.style.color = colors[Math.floor(Math.random() * colors.length)];

                container.appendChild(flake);
            }
        }

        // ระบบเจนรหัส
        function generateCode() {
            const city = $('#genCity').val();
            const setting = $('#genSetting').val();
            const gender = $('#genGender').val();
            const species = $('#genSpecies').val();
            const dateInput = document.getElementById('genDate').value;
            
            const block1 = gender + species + setting;
            
            // ใช้ วันเกิด (MMDD) มาเป็นรหัสส่วนกลาง ให้ไม่ซ้ำกัน
            let block2 = "0000";
            if (dateInput) {
                const parts = dateInput.split('-'); 
                const month = parts[1];
                const day = parts[2];
                block2 = month + day; 
            }

            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let block3 = "";
            for (let i = 0; i < 4; i++) {
                block3 += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            const finalCode = `AD-${city}-${block1}-${block2}-${block3}`;
            
            document.getElementById('displayCode').innerText = finalCode;
        }
    </script>

</body>
</html>
